
name: Get OIDC JWT

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Request and Decode OIDC JWT
        shell: bash
        run: |
          RESPONSE=$(curl -sS -G \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=https://cloak.example.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          export TOKEN

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          parts = token.split(".")

          if len(parts) != 3:
              raise ValueError("Invalid JWT format")

          header_part, payload_part, signature_part = parts

          def decode(part):
              part += "=" * (-len(part) % 4)
              decoded = base64.urlsafe_b64decode(part)
              return json.loads(decoded)

          print("=" * 60)
          print("1. RAW JWT")
          print("=" * 60)
          print(token)

          print("\n" + "=" * 60)
          print("2. DECODED HEADER")
          print("=" * 60)
          print(json.dumps(decode(header_part), indent=2))

          print("\n" + "=" * 60)
          print("3. DECODED PAYLOAD")
          print("=" * 60)
          print(json.dumps(decode(payload_part), indent=2))

          print("\n" + "=" * 60)
          print("4. SIGNATURE (BASE64URL)")
          print("=" * 60)
          print(signature_part)
          PY
